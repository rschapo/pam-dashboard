[build]
  publish = "public"
  # The generator is a local pre-deploy step; it is NOT run by Netlify.
  # Run `py generator/process_pam.py` locally before pushing.

[[headers]]
  for = "/data/*.json"
  [headers.values]
    # Os dados mudam a cada publicação. O navegador guarda a cópia, mas confere com o
    # servidor antes de usá-la (ETag: se nada mudou, a resposta é curta). Com um dia
    # de cache, quem voltava ao site via o código novo com os dados velhos.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
