# variables.yaml — Mapeamento de variáveis/tabelas SIDRA por tema
# ---------------------------------------------------------------------------
# REGRA (briefing 6.3): NÃO assumir números de tabela sem validação. As tabelas
# abaixo são CANDIDATAS: o download roda `metadados` de cada uma e casa as
# variáveis por NOME (descoberta em tempo de execução, como no download_pevs).
# Se a tabela candidata não existir/mudar, o log registra e o operador ajusta.
# `validar: true` obriga o pipeline a confirmar a tabela nos metadados antes de usar.

pevs:
  # Já implementado em generator/download_pevs_ibge.py — replicado aqui como referência.
  tabelas:
    - {tabela: 291,  tipo: Silvicultura,     metricas: {q: "Quantidade produzida", v: "Valor da produção"}}
    - {tabela: 289,  tipo: Extracao,         metricas: {q: "Quantidade produzida", v: "Valor da produção"}}
    - {tabela: 5930, tipo: AreaSilvicultura, metricas: {a: "Área total existente"}}

censo_agro_2017:
  ano_referencia: 2017
  # Tabelas candidatas do Censo Agropecuário 2017 na SIDRA. Confirmar por metadados.
  # Cada bloco vira uma tabela temática de saída (evita uma tabela larga única).
  temas:
    area_groups:
      descricao: "Número e área de estabelecimentos por grupos de área total"
      # a 6778 e a 6779 não têm a área; a 6754 tem as duas variáveis por grupo
      tabelas_candidatas: [6754]
      metricas: {estabelecimentos: "Número de estabelecimentos", area: "Área dos estabelecimentos"}
      classificacao_busca: ["grupos de área total"]
      validar: true
    family_farming:
      descricao: "Agricultura familiar x não familiar (Lei 11.326)"
      tabelas_candidatas: [6778, 6846]
      # a abertura familiar/não familiar é a classificação "Tipologia" (c829)
      classificacao_busca: ["tipologia"]
      validar: true
    land_condition:
      descricao: "Condição legal das terras / condição do produtor"
      tabelas_candidatas: [6853, 6854]
      classificacao_busca: ["condição do produtor", "condição legal"]
      validar: true
    machinery:
      descricao: "Tratores: estabelecimentos com trator e frota existente, por potência"
      tabelas_candidatas: [6870, 6871]
      metricas:
        estabelecimentos: "estabelecimentos agropecuários com tratores"
        tratores: "tratores existentes"
      classificacao_busca: ["potência dos tratores", "tratores", "máquinas", "colheitadeiras"]
      validar: true
    irrigation:
      descricao: "Estabelecimentos que utilizam irrigação e área irrigada"
      tabelas_candidatas: [6859]
      metricas:
        estabelecimentos: "Número de estabelecimentos agropecuários com uso de irrigação"
        area: "Área irrigada"
      classificacao_busca: ["irrigação"]
      validar: true
    storage:
      descricao: "Unidades armazenadoras (armazéns e silos): estabelecimentos, quantidade e capacidade"
      # a 6875 é de veículos; a armazenagem do Censo 2017 está na 6866-6868
      tabelas_candidatas: [6866, 6867]
      metricas:
        estabelecimentos: "Número de estabelecimentos agropecuários com unidades armazenadoras"
        unidades: "Número de unidades armazenadoras"
        capacidade: "Capacidade das unidades armazenadoras"
      classificacao_busca: ["tipo de unidade armazenadora"]
      validar: true
    finance:
      descricao: "Estabelecimentos que obtiveram financiamento"
      tabelas_candidatas: [6895]
      classificacao_busca: ["financiamento"]
      validar: true
    technical_assistance:
      descricao: "Estabelecimentos com orientação/assistência técnica"
      # a 6847 não abre pela orientação técnica; a 6780 abre (c12567, recebe/não recebe e origem)
      tabelas_candidatas: [6780, 6779]
      classificacao_busca: ["origem da orientação técnica"]
      validar: true
    land_use:
      descricao: "Utilização das terras (lavouras, pastagens, matas)"
      tabelas_candidatas: [6881]
      metricas:
        estabelecimentos: "Número de estabelecimentos agropecuários com área"
        area: "Área dos estabelecimentos"
      classificacao_busca: ["utilização das terras"]
      validar: true
    activity:
      descricao: "Grupos de atividade econômica predominante"
      tabelas_candidatas: [6778]
      classificacao_busca: ["grupos de atividade econômica"]
      validar: true

# Observação: variáveis reais (códigos) são resolvidas por nome nos metadados;
# não fixamos códigos numéricos aqui de propósito (robustez a mudanças SIDRA).
