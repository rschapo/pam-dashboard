<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google tag (gtag.js) — carregado somente após consentimento; ver banner de cookies no fim do body -->
<title>Glossário do Dashboard PAM — AgroCore Gestão do Agronegócio</title>
<meta name="description" content="O que cada métrica do Dashboard PAM mede, como é calculada e o que ela não permite concluir, com as fontes e o período de cada base.">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="gl-body">

<header id="hdr">
  <div class="logo-wrap">
    <a class="logo-badge" href="./" title="Voltar ao painel"><img src="assets/logo.png" alt="AgroCore — Gestão do Agronegócio" class="logo-img"></a>
  </div>

  <div class="hdr-divider"></div>

  <div class="hdr-title">
    <h1>Glossário do Dashboard PAM</h1>
    <div class="hdr-sub">Métricas, cálculos, cuidados e fontes</div>
  </div>

  <a class="hdr-link" href="./">← Voltar ao painel</a>
</header>

<main class="gl-pagina">
  <!-- O conteúdo sai de js/glossario.js, o mesmo da aba Glossário do painel -->
  <div id="glossario" class="gl"><p class="gl-intro">Carregando o glossário…</p></div>
</main>

<script src="js/glossario.js"></script>
<script>
// Confere o JSON com o servidor antes de usar a cópia guardada (ver netlify.toml).
// Sem ele o texto aparece do mesmo jeito, só sem as listas e a tabela de fontes.
fetch('data/glossario.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .catch(e => { console.error('Erro ao carregar glossario.json', e); return null; })
  .then(dados => {
    GLOSSARIO.render(document.getElementById('glossario'), dados, { hash: true });
    // glossario.html#gl-car-imov abre na métrica, e #gl-sec-car, na seção.
    const alvo = decodeURIComponent(location.hash.slice(1)).replace(/^gl-/, '');
    if (alvo) GLOSSARIO.irPara(alvo, !alvo.startsWith('sec-'));
  });
</script>

</body>
</html>
